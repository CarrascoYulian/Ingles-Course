name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
        env:
          # El build no necesita un proyecto Supabase real: sin estas
          # variables la app compila en modo demo (ver src/lib/env.ts).
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
